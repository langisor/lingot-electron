appId: com.langisor.lingot
productName: Lingot Tuner
copyright: Copyright © 2026 langisor
directories:
  buildResources: assets
  output: release
files:
  - dist
  - node_modules
  - package.json
publish:
  provider: github
  owner: langisor
  repo: lingot-electron
  releaseType: draft
win:
  target:
    - nsis
    - portable
mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  hardenedRuntime: true
  entitlements: signing/entitlements.mac.plist
  entitlementsInherit: signing/entitlements.mac.inherit.plist
  gatekeeperAssess: false
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Lingot Tuner uses your microphone to detect instrument pitch.
linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
